<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday! 🎂</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #fdfaf6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            color: #555;
            text-align: center;
        }
        .container { 
            padding: 30px; 
            transition: all 0.5s ease; 
            max-width: 90%;
        }
        /* UKURAN JUDUL JADI GEDE */
        h1 { 
            font-size: 2.5rem; 
            margin-bottom: 25px; 
            line-height: 1.2;
        }
        /* UKURAN TEKS ISI JADI GEDE */
        p { 
            font-size: 1.5rem; 
            margin-bottom: 30px;
            line-height: 1.5;
        }
        /* UKURAN TOMBOL JADI GEDE & MANTAP */
        .btn {
            background: white;
            border: 1px solid #ddd;
            padding: 20px 45px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-family: inherit;
            font-size: 1.4rem;
            font-weight: bold;
            color: #555;
        }
        .hidden { display: none; }
        /* UKURAN EMOJI JADI RAKSASA */
        .heart { 
            color: #e74c3c; 
            font-size: 5rem; 
            margin-top: 30px; 
        }
    </style>
</head>
<body>

    <div id="p1" class="container">
        <h1>happy birthday my bestofrendo!! ✨</h1>
        <p>Hisashiburi Dana Mugiwara... klik yeah</p>
        <button class="btn" onclick="next(1)">buka ‹𝟹</button>
    </div>

    <div id="p2" class="container hidden">
        <h1>Chotto matte...</h1>
        <p>happy birthday grid</p>
        <button class="btn" onclick="next(2)">lanjut ‹𝟹</button>
    </div>

    <div id="p3" class="container hidden">
        <h1>jadi gini...</h1>
        <p>makasih ya .<br>udah jadi mai prend</p>
        <p>May your special day be filled with lots of laughter and joy! </p>
        <div class="heart">૮꒰ ˶• ༝ •˶꒱ა</div>
    </div>

    <script>
        function next(current) {
            document.getElementById('p' + current).classList.add('hidden');
            document.getElementById('p' + (current + 1)).classList.remove('hidden');
        }
    </script>
</body>
</html>
